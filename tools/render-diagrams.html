const SRC={"crewquarters": "flowchart TB\n    U[\"Browser\"] --> RP[\"Reverse proxy\"]\n    RP --> UI[\"Web UI\"]\n    RP --> API[\"Control API\"]\n    API --> DB[(\"PostgreSQL + pgvector\")]\n    API --> W[\"Scheduler / worker\"]\n    W --> RD[\"Runtime daemon\"]\n    RD --> A[\"Per-run agent containers\"]\n    A --> B[\"Capability broker\"]\n    B --> MG[\"Model gateway\"]\n    B --> KB[\"Knowledge service\"]\n    B --> G[\"Google / Twilio adapters\"]\n    MG --> V[\"On-demand vLLM container\"]\n    MG --> C[\"OpenAI / Anthropic\"]\n", "gpu": "flowchart LR\n  subgraph T4[\"cuda-matmul: CUDA C on Tesla T4\"]\n    direction TB\n    IN[\"Seeded random A, B\"] --> CPU[\"CPU reference<br/>triple loop\"]\n    IN --> H2D[\"cudaMemcpy<br/>host to device\"]\n    H2D --> K[\"matmul_kernel<br/>2D grid, 16x16 blocks<br/>1 thread per C element\"]\n    K --> D2H[\"cudaMemcpy<br/>device to host\"]\n    CPU --> CHK{\"max abs diff<br/>vs CPU\"}\n    D2H --> CHK\n    EV([\"CUDA events\"]) -. \"time each stage\" .-> K\n    NV([\"nvprof\"]) -. \"GPU time breakdown\" .-> K\n  end\n\n  subgraph R5090[\"roofline-rtx5090: PyTorch on RTX 5090\"]\n    direction TB\n    COM[\"common/<br/>GPU UUID, CUDA-event timing,<br/>vendor peak specs, CSV + run log\"]\n    COM --> A[\"A: provenance<br/>nvidia-smi + spec check\"]\n    COM --> B[\"B: GEMM TFLOPS<br/>FP32 to FP8 vs N\"]\n    COM --> C[\"C: roofline<br/>add vs matmul\"]\n    COM --> D[\"D: naive vs fused attention<br/>+ OOM bisection\"]\n    COM --> E[\"E: 20-min sustained load<br/>+ nvidia-smi sampler thread\"]\n    A & B & C & D & E --> CSV[(\"results/*.csv<br/>UUID-tagged\")]\n    CSV --> FIG[\"figures/*.png\"]\n    CSV --> F[\"F: summary table\"] --> MET[\"METRICS.md\"]\n  end\n", "npu": "flowchart TB\n    data[\"Datasets (not committed)<br/>ImageNet-20 split lists in dataset/<br/>LR2 / HR2 restoration pairs\"]\n\n    subgraph train[\"Training (GPU or Colab)\"]\n        ds[\"dataset.py<br/>image loading and augmentation\"]\n        mode BS --> KAFKA\n    MSG --> KAFKA\n    ANALYTICS --> KAFKA\n    MEMBER --> KAFKA\n    AI --> KAFKA\n", "aki": "flowchart TB\n    mimic[\"MIMIC-IV CSVs<br/>labevents, outputevents, icustays,<br/>patients, admissions\"]\n\n    subgraph batch[\"Batch path\"]\n        bronze[\"BRONZE (Snowflake)<br/>storage/snowflake_setup.py DDL<br/>ingestion/run_copy_into.py COPY INTO\"]\n        gx1{\"GX gate 1<br/>validation/ge_checkpoint_1.py<br/>creatinine 0.3\u201315.0 mg/dL,<br/>100% subject_id coverage\"}\n        silver[\"SILVER (dbt)<br/>stg_* \u2192 silver_creatinine_events,<br/>silver_urine_output_events, silver_icu_cohort\"]\n        bloom[\"SilverBloomFilter<br/>7-day dedup: UNIQUE / DUP\"]\n        gx2{\"GX gate 2<br/>validation/ge_checkpoint_2.py\"}\n        gold[\"GOLD (dbt)<br/>gold_features_hourly, gold_kdigo_hourly<br/>creatinine_ratio, urine_output_velocity\"]\n        mart[\"MART<br/>mart_training_dataset\"]\n        train[\"models/train_lr.py \u00b7 train_gbt.py<br/>MLflow: AUROC, AUPRC, F1, Brier\"]\n    end\n\n    subgraph stream[\"Streaming path\"]\n        prod[\"producer/kafka_producer.py<br/>topic_for(event_type)\"]\n        topics[[\"Kafka topics<br/>labs \u00b7 vitals \u00b7 fluids\"]]\n        job[\"consumer/streaming_job.py<br/>Spark Structured Streaming, foreachBatch\"]\n        state[\"state/patient_state.py<br/>48h sliding window per patient,<br/>min-baseline creatinine\"]\n        algos[\"algorithms/<br/>DGIM \u00b7 Flajolet-Martin \u00b7 Reservoir sampling\"]\n        live[(\"MART.LIVE_RISK_SCORES\")]\n    end\n\n    subgraph serve[\"Privacy and reporting\"]\n        priv[\"privacy/<br/>k-anonymity (k=5) \u00b7 Laplace DP (\u03b5=0.5)\"]\n        twin[\"similarity/<br/>LSH clinical twins\"]\n        dash[\"dashboard/aki_final_dashboard.html<br/>Real-time \u00b7 Batch \u00b7 Architecture\"]\n    end\n\n    mimic --> bronze --> gx1 --> silver\n    silver --> bloom --> gx2 --> gold --> mart --> train\n    silver -.->|\"replayed as live events\"| prod --> topics --> job\n    job --> state --> live\n    job --> algos\n    train --> priv\n    live --> priv --> dash\n    twin --> dash\n", "voltwise": "classDiagram\n    direction LR\n    class TariffSpec {\n      +customerChargePerMonth\n      +demandChargePerKw\n      +periods: List~TouPeriod~\n      +rateAt(time)\n      +validate()\n    }\n    class BillCalculator {\n      +bill(tariff, gridKw) List~MonthlyBill~\n    }\n    class Battery {\n      +charge(kw) accepted\n      +discharge(kw) delivered\n    }\n    class BatteryLp {\n      +solve(load, price, demandCharge, ...) Plan\n    }\n    class ThresholdDispatcher\n    class ForecastDispatcher\n    class OptimalDispatcher\n    class DayAheadForecast {\n      <<interface>>\n      +forecast(dayStart, hours)\n    }\n    ThresholdDispatcher --> Battery\n    ForecastDispatcher --> Battery\n    ForecastDispatcher --> BatteryLp\n    ForecastDispatcher --> DayAheadForecast\n    OptimalDispatcher --> BatteryLp\n    ThresholdDispatcher ..> TariffSpec\n    ForecastDispatcher ..> TariffSpec\n    OptimalDispatcher ..> TariffSpec\n    BillCalculator ..> TariffSpec\n"};
mermaid.initialize({startOnLoad:false,securityLevel:"loose",theme:"base",fontFamily:"Arial, Helvetica, sans-serif",

(async()=>{for(const [k,v] of Object.entries(SRC)){const pre=document.createElement('div');pre.id='out-'+k;
 try{const {svg}=await mermaid.render('d'+k,v);pre.setAttribute('data-svg',btoa(unescape(encodeURIComponent(svg))));}catch(e){pre.setAttribute('data-err',String(e));}
 document.body.appendChild(pre);} document.body.setAttribute('data-done','1');})();
